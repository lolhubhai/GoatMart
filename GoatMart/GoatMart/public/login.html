
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auth • GoatMart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-tabs">
      <button class="tab-btn active" onclick="showTab('login')"><i class="fas fa-lock"></i> Login</button>
      <button class="tab-btn" onclick="showTab('register')"><i class="fas fa-user-plus"></i> Register</button>
    </div>

    <div id="login" class="auth-tab-content active">
      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <i class="fas fa-user"></i>
          <input type="text" id="loginUsername" placeholder="Username" required>
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="Password" required>
        </div>
        <button type="submit" class="submit-btn"><i class="fas fa-sign-in-alt"></i> Login</button>
        <p class="auth-links">
          <a href="#" onclick="showTab('forgot')">Forgot Password?</a>
        </p>
      </form>
    </div>

    <div id="register" class="auth-tab-content">
      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <i class="fas fa-user"></i>
          <input type="text" id="registerUsername" placeholder="Username" required>
        </div>
        <div class="form-group">
          <i class="fas fa-signature"></i>
          <input type="text" id="registerName" placeholder="Full Name" required>
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="registerPassword" placeholder="Password" required>
        </div>
        <div class="form-group">
          <i class="fas fa-image"></i>
          <input type="file" id="profilePicture" accept="image/*">
          <label for="profilePicture" class="file-label">Choose Profile Picture</label>
        </div>
        <button type="submit" class="submit-btn"><i class="fas fa-user-plus"></i> Register</button>
      </form>
    </div>

    <div id="forgot" class="auth-tab-content">
      <form id="forgotForm" class="auth-form">
        <div class="form-group">
          <i class="fas fa-user"></i>
          <input type="text" id="forgotUsername" placeholder="Username" required>
        </div>
        <div class="form-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="newPassword" placeholder="New Password" required>
        </div>
        <button type="submit" class="submit-btn"><i class="fas fa-key"></i> Reset Password</button>
        <p class="auth-links">
          <a href="#" onclick="showTab('login')">Back to Login</a>
        </p>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
