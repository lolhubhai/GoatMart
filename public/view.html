
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>View Command - GoatMart</title>
    
    <!-- Theme Color for Android -->
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Icons+Outlined&family=Material+Icons&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <!-- Prism.js for code highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="css/mobile.css">
    
    <style>
        /* Android Material Design Variables */
        :root {
            --primary: #6366f1;
            --primary-variant: #4f46e5;
            --secondary: #10b981;
            --secondary-variant: #059669;
            --surface: #ffffff;
            --background: #f8fafc;
            --error: #ef4444;
            --on-primary: #ffffff;
            --on-secondary: #ffffff;
            --on-surface: #1f2937;
            --on-background: #374151;
            --elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --elevation-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --elevation-3: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
            --radius-small: 4px;
            --radius-medium: 8px;
            --radius-large: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: var(--background);
            min-height: 100vh;
            color: var(--on-background);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Material Design Top App Bar */
        .top-app-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-shadow: var(--elevation-2);
            border-bottom: 1px solid rgba(0,0,0,0.12);
        }

        .app-bar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-bar-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--on-surface);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(0,0,0,0.04);
        }

        .app-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--on-surface);
        }

        .app-bar-actions {
            display: flex;
            gap: 8px;
        }

        /* Main Content */
        .main-content {
            margin-top: 64px;
            min-height: calc(100vh - 64px);
            padding: 24px 16px;
        }

        .view-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .command-header-card {
            background: var(--surface);
            border-radius: var(--radius-large);
            padding: 24px;
            box-shadow: var(--elevation-1);
            margin-bottom: 16px;
        }

        .command-title {
            font-size: 28px;
            font-weight: 400;
            margin-bottom: 8px;
            color: var(--on-surface);
        }

        .command-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            margin-bottom: 16px;
            color: var(--on-surface);
            opacity: 0.7;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .command-description {
            font-size: 16px;
            line-height: 1.6;
            color: var(--on-surface);
            margin-bottom: 16px;
        }

        .command-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 24px;
        }

        .tag {
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }

        .command-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        /* Material Design Buttons */
        .btn {
            border: none;
            border-radius: var(--radius-small);
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
            padding: 12px 24px;
        }

        .btn-contained {
            background: var(--primary);
            color: var(--on-primary);
            box-shadow: var(--elevation-1);
        }

        .btn-contained:hover {
            box-shadow: var(--elevation-2);
            transform: translateY(-1px);
        }

        .btn-outlined {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }

        .btn-outlined:hover {
            background: rgba(99, 102, 241, 0.04);
        }

        .btn-text {
            background: transparent;
            color: var(--primary);
        }

        .btn-text:hover {
            background: rgba(99, 102, 241, 0.04);
        }

        /* Code Display */
        .code-card {
            background: var(--surface);
            border-radius: var(--radius-large);
            overflow: hidden;
            box-shadow: var(--elevation-1);
            margin-bottom: 16px;
        }

        .code-header {
            background: #2d3748;
            color: white;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .code-title {
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 16px;
            border-radius: var(--radius-small);
            font-size: 12px;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .code-container {
            max-height: 500px;
            overflow: auto;
        }

        pre {
            margin: 0;
            padding: 24px;
            font-size: 14px;
            line-height: 1.5;
            background: #1a202c !important;
        }

        code {
            font-family: 'Courier New', Consolas, Monaco, monospace;
        }

        /* Raw Link Card */
        .raw-link-card {
            background: var(--surface);
            border-radius: var(--radius-large);
            padding: 24px;
            box-shadow: var(--elevation-1);
            margin-bottom: 16px;
        }

        .raw-link-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            color: var(--on-surface);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .link-container {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .link-input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: var(--radius-small);
            background: var(--background);
            color: var(--on-surface);
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .link-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 64px 16px;
            color: var(--on-surface);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(99, 102, 241, 0.3);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Error State */
        .error-state {
            text-align: center;
            padding: 64px 16px;
            color: var(--error);
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .view-container {
                margin: 0;
            }

            .command-header-card,
            .code-card,
            .raw-link-card {
                margin: 0 8px 16px;
                padding: 16px;
            }

            .main-content {
                padding: 16px 0;
            }

            .command-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }

            .link-container {
                flex-direction: column;
                gap: 12px;
            }

            .link-input {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Material Design Top App Bar -->
    <header class="top-app-bar">
        <div class="app-bar-content">
            <div class="app-bar-title">
                <button class="back-btn" onclick="window.history.back()">
                    <i class="material-icons">arrow_back</i>
                </button>
                <div class="app-title">Command Details</div>
            </div>
            <div class="app-bar-actions">
                <button class="btn btn-text" onclick="shareCommand()">
                    <i class="material-icons">share</i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="view-container" id="contentContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <div>Loading command details...</div>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="js/android-ui.js"></script>
    <script>
        // Get item ID from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const itemId = urlParams.get('id');

        async function loadCommand() {
            if (!itemId) {
                showError('No command ID specified');
                return;
            }

            try {
                const response = await fetch(`/api/item/${itemId}`);
                if (!response.ok) {
                    throw new Error('Command not found');
                }

                const command = await response.json();
                displayCommand(command);
            } catch (error) {
                console.error('Error loading command:', error);
                showError(error.message);
            }
        }

        function displayCommand(command) {
            const container = document.getElementById('contentContainer');
            const rawLink = command.rawLink || `${window.location.origin}/raw/${command.shortId}`;
            
            container.innerHTML = `
                <!-- Command Header -->
                <div class="command-header-card">
                    <h1 class="command-title">${escapeHtml(command.itemName)}</h1>
                    <div class="command-meta">
                        <div class="meta-item">
                            <i class="material-icons" style="font-size: 18px;">person</i>
                            <span>by ${escapeHtml(command.authorName)}</span>
                        </div>
                        <div class="meta-item">
                            <i class="material-icons" style="font-size: 18px;">schedule</i>
                            <span>${new Date(command.createdAt).toLocaleDateString()}</span>
                        </div>
                        <div class="meta-item">
                            <i class="material-icons" style="font-size: 18px;">visibility</i>
                            <span>${command.views || 0} views</span>
                        </div>
                        <div class="meta-item">
                            <i class="material-icons" style="font-size: 18px;">favorite</i>
                            <span id="likeCount">${command.likes || 0} likes</span>
                        </div>
                    </div>
                    <div class="command-description">
                        ${escapeHtml(command.description)}
                    </div>
                    <div class="command-tags">
                        <span class="tag">${command.type}</span>
                    </div>
                    <div class="command-actions">
                        <button class="btn btn-contained" onclick="likeCommand(${command.itemID})">
                            <i class="material-icons">favorite</i>
                            Like Command
                        </button>
                        <button class="btn btn-outlined" onclick="copyCode()">
                            <i class="material-icons">content_copy</i>
                            Copy Code
                        </button>
                        <button class="btn btn-text" onclick="shareCommand()">
                            <i class="material-icons">share</i>
                            Share
                        </button>
                    </div>
                </div>

                <!-- Raw Link Card -->
                <div class="raw-link-card">
                    <div class="raw-link-title">
                        <i class="material-icons">link</i>
                        Raw Code URL
                    </div>
                    <div class="link-container">
                        <input type="text" class="link-input" value="${rawLink}" readonly id="rawLinkInput">
                        <button class="btn btn-outlined" onclick="copyRawLink()">
                            <i class="material-icons">content_copy</i>
                            Copy
                        </button>
                        <a href="${rawLink}" target="_blank" class="btn btn-contained">
                            <i class="material-icons">open_in_new</i>
                            View Raw
                        </a>
                    </div>
                </div>

                <!-- Code Display -->
                <div class="code-card">
                    <div class="code-header">
                        <div class="code-title">
                            <i class="material-icons">code</i>
                            Command Code
                        </div>
                        <button class="copy-btn" onclick="copyCode()">
                            <i class="material-icons" style="font-size: 16px;">content_copy</i>
                            Copy
                        </button>
                    </div>
                    <div class="code-container">
                        <pre><code class="language-javascript" id="codeContent">${escapeHtml(command.code)}</code></pre>
                    </div>
                </div>
            `;

            // Highlight code
            Prism.highlightAll();
            
            // Update page title
            document.title = `${command.itemName} - GoatMart`;
        }

        function showError(message) {
            document.getElementById('contentContainer').innerHTML = `
                <div class="error-state">
                    <i class="material-icons error-icon">error_outline</i>
                    <h2 style="margin-bottom: 8px; font-weight: 400;">Command Not Found</h2>
                    <p style="color: var(--on-surface); opacity: 0.7; margin-bottom: 24px;">${message}</p>
                    <a href="index.html" class="btn btn-contained">
                        <i class="material-icons">home</i>
                        Go Back Home
                    </a>
                </div>
            `;
        }

        async function likeCommand(itemID) {
            try {
                const response = await fetch(`/api/items/${itemID}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                
                if (result.success) {
                    document.getElementById('likeCount').textContent = `${result.likes} likes`;
                    
                    if (window.AndroidUI) {
                        AndroidUI.showSnackbar('Thanks for liking! ❤️');
                    }
                }
            } catch (error) {
                console.error('Error liking command:', error);
                if (window.AndroidUI) {
                    AndroidUI.showSnackbar('Error liking command');
                }
            }
        }

        function copyCode() {
            const codeElement = document.getElementById('codeContent');
            if (codeElement) {
                const code = codeElement.textContent;
                navigator.clipboard.writeText(code).then(() => {
                    if (window.AndroidUI) {
                        AndroidUI.showSnackbar('Code copied to clipboard! 📋');
                    }
                }).catch(err => {
                    console.error('Failed to copy code:', err);
                });
            }
        }

        function copyRawLink() {
            const linkInput = document.getElementById('rawLinkInput');
            if (linkInput) {
                linkInput.select();
                document.execCommand('copy');
                
                if (window.AndroidUI) {
                    AndroidUI.showSnackbar('Raw link copied! 🔗');
                }
            }
        }

        function shareCommand() {
            const url = window.location.href;
            
            if (navigator.share) {
                navigator.share({
                    title: document.querySelector('.command-title')?.textContent || 'GoatMart Command',
                    text: 'Check out this awesome bot command!',
                    url: url
                });
            } else {
                navigator.clipboard.writeText(url).then(() => {
                    if (window.AndroidUI) {
                        AndroidUI.showSnackbar('Link copied to clipboard! 🔗');
                    }
                });
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        // Load the command when page loads
        document.addEventListener('DOMContentLoaded', loadCommand);
    </script>
</body>
</html>
