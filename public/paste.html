
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Command • GoatMart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav-menu">
    <a href="/" class="nav-link"><i class="fas fa-home"></i> Home</a>
    <a href="/paste.html" class="nav-link active"><i class="fas fa-plus-circle"></i> Create Command</a>
  </nav>

  <div class="container">
    <section class="paste-form">
      <h2><i class="fas fa-share-alt"></i> Share Your Command</h2>
      <p class="form-description">Share your commands with a permanent link!</p>

      <form id="uploadForm">
        <div class="form-group">
          <label for="authorName"><i class="fas fa-user"></i> Your Name</label>
          <input type="text" id="authorName" name="authorName" required placeholder="Enter your name">
        </div>

        <div class="form-group">
          <label for="itemName"><i class="fas fa-tag"></i> Command Name</label>
          <input type="text" id="itemName" name="itemName" required placeholder="Give your command a descriptive name">
        </div>

        <div class="form-group">
          <label for="description"><i class="fas fa-info-circle"></i> Description</label>
          <textarea id="description" name="description" required placeholder="Explain what your command does"></textarea>
        </div>

        <div class="form-group">
          <label for="type"><i class="fas fa-robot"></i> Command Type</label>
          <select id="type" name="type" required>
            <option value="" disabled selected>Select type</option>
            <option value="GoatBot">🤖 GoatBot</option>
            <option value="MiraiBot">🔮 MiraiBot</option>
            <option value="AutoBot">⚡ AutoBot</option>
          </select>
        </div>

        <div class="form-group">
          <label for="code"><i class="fas fa-code"></i> Command Code</label>
          <textarea id="code" name="code" required placeholder="Paste your command code here"></textarea>
        </div>

        <div class="form-group">
          <button type="submit" class="submit-btn">
            <i class="fas fa-share-alt"></i> Share Command
          </button>
        </div>
      </form>

      <div id="commandPreview" class="preview-section"></div>
    </section>
  </div>
  <script src="script.js"></script>
</body>
</html>

        <div class="form-group">
          <label for="code"><i class="fas fa-code"></i> Command Code</label>
          <textarea id="code" name="code" class="code-input" required placeholder="Paste your command code here"></textarea>
        </div>

        <button type="submit" class="submit-btn">
          <i class="fas fa-upload"></i> Share Command
        </button>
      </form>
    </section>
  </div>

  <script>
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = {
        authorName: document.getElementById('authorName').value.trim(),
        itemName: document.getElementById('itemName').value.trim(),
        description: document.getElementById('description').value.trim(),
        type: document.getElementById('type').value,
        code: document.getElementById('code').value.trim()
      };

      try {
        const response = await fetch('/api/items', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(formData)
        });

        const data = await response.json();

        if (data.success) {
          alert(`Command shared successfully!\nYour link: ${window.location.origin}/raw/${data.codeUrl}`);
          window.location.href = `/view/${data.itemId}`;
        } else {
          throw new Error(data.error || 'Failed to share command');
        }
      } catch (error) {
        alert('Error sharing command: ' + error.message);
        console.error('Upload error:', error);
      }
    });
  </script>
</body>
</html>
