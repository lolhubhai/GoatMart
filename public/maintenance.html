
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance - GoatMart</title>
    <meta name="theme-color" content="#ef4444">
    
    <!-- Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ef4444;
            --primary-variant: #dc2626;
            --surface: #ffffff;
            --background: #f8fafc;
            --on-primary: #ffffff;
            --on-surface: #1f2937;
            --on-background: #374151;
            --elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --elevation-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --radius-large: 16px;
            --radius-medium: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .maintenance-container {
            background: var(--surface);
            border-radius: var(--radius-large);
            padding: 48px 32px;
            width: 100%;
            max-width: 500px;
            box-shadow: var(--elevation-2);
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.1);
        }

        .maintenance-icon {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, var(--primary), var(--primary-variant));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            color: var(--on-primary);
            font-size: 60px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .maintenance-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--on-surface);
            margin-bottom: 16px;
        }

        .maintenance-message {
            font-size: 16px;
            color: var(--on-surface);
            opacity: 0.8;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .estimated-time-container {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: var(--radius-medium);
            padding: 16px;
            margin-bottom: 32px;
            display: none;
        }

        .estimated-time-label {
            font-size: 12px;
            color: var(--primary);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .estimated-time {
            font-size: 16px;
            color: var(--primary);
            font-weight: 600;
        }

        .retry-button {
            background: var(--primary);
            color: var(--on-primary);
            border: none;
            border-radius: var(--radius-medium);
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: var(--elevation-1);
        }

        .retry-button:hover {
            box-shadow: var(--elevation-2);
            transform: translateY(-2px);
        }

        .admin-link {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid rgba(0,0,0,0.1);
        }

        .admin-link a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .admin-link a:hover {
            text-decoration: underline;
        }

        .last-checked {
            margin-top: 16px;
            font-size: 12px;
            color: var(--on-surface);
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            <i class="material-icons">build</i>
        </div>
        
        <h1 class="maintenance-title" id="maintenanceTitle">🚧 Website Under Maintenance</h1>
        <p class="maintenance-message" id="maintenanceMessage">
            We're currently performing scheduled maintenance to improve your experience. 
            We'll be back shortly! Thank you for your patience.
        </p>

        <div class="estimated-time-container" id="estimatedTimeContainer">
            <div class="estimated-time-label">Estimated Time</div>
            <div class="estimated-time" id="estimatedTime"></div>
        </div>

        <button class="retry-button" onclick="checkMaintenanceStatus()">
            <i class="material-icons">refresh</i>
            Check Again
        </button>

        <div class="admin-link">
            <a href="/admin-login">
                <i class="material-icons" style="font-size: 16px;">admin_panel_settings</i>
                Admin Access
            </a>
        </div>

        <div class="last-checked" id="lastChecked">
            Last checked: Never
        </div>
    </div>

    <script>
        // Load maintenance information from server
        async function loadMaintenanceInfo() {
            try {
                const response = await fetch('/api/maintenance');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('maintenanceTitle').textContent = data.title || '🚧 Website Under Maintenance';
                    document.getElementById('maintenanceMessage').textContent = data.message || 'We\'re currently performing scheduled maintenance to improve your experience. We\'ll be back shortly! Thank you for your patience.';

                    if (data.estimatedTime) {
                        document.getElementById('estimatedTime').textContent = data.estimatedTime;
                        document.getElementById('estimatedTimeContainer').style.display = 'block';
                    }
                }
                
                document.getElementById('lastChecked').textContent = `Last checked: ${new Date().toLocaleTimeString()}`;
            } catch (error) {
                console.error('Error loading maintenance info:', error);
                document.getElementById('lastChecked').textContent = `Last checked: Error at ${new Date().toLocaleTimeString()}`;
            }
        }

        // Check if maintenance mode is still active
        async function checkMaintenanceStatus() {
            try {
                const button = document.querySelector('.retry-button');
                const originalText = button.innerHTML;
                button.innerHTML = '<i class="material-icons">hourglass_empty</i>Checking...';
                button.disabled = true;

                const response = await fetch('/api/maintenance');
                if (response.ok) {
                    const data = await response.json();
                    if (!data.enabled) {
                        button.innerHTML = '<i class="material-icons">check_circle</i>Website is back online!';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        button.innerHTML = '<i class="material-icons">info</i>Still in maintenance...';
                        setTimeout(() => {
                            button.innerHTML = originalText;
                            button.disabled = false;
                        }, 2000);
                    }
                    
                    document.getElementById('lastChecked').textContent = `Last checked: ${new Date().toLocaleTimeString()}`;
                } else {
                    throw new Error('Server error');
                }
            } catch (error) {
                console.error('Error checking maintenance status:', error);
                const button = document.querySelector('.retry-button');
                button.innerHTML = '<i class="material-icons">error</i>Check failed';
                setTimeout(() => {
                    button.innerHTML = '<i class="material-icons">refresh</i>Check Again';
                    button.disabled = false;
                }, 2000);
                document.getElementById('lastChecked').textContent = `Last checked: Error at ${new Date().toLocaleTimeString()}`;
            }
        }

        // Initialize
        loadMaintenanceInfo();

        // Auto-check every 30 seconds if page is visible
        let isPageVisible = true;
        document.addEventListener('visibilitychange', function() {
            isPageVisible = !document.hidden;
        });

        setInterval(() => {
            if (isPageVisible) {
                loadMaintenanceInfo();
            }
        }, 30000);
    </script>
</body>
</html>
