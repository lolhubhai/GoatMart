<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Under Maintenance - GoatMart</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .maintenance-container {
            text-align: center;
            max-width: 600px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .maintenance-icon {
            font-size: 80px;
            margin-bottom: 30px;
            color: #ffd700;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        .maintenance-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .maintenance-message {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0.9;
        }

        .estimated-time {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .progress-container {
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4e);
            width: 0%;
            border-radius: 4px;
            animation: loading 3s ease-in-out infinite;
        }

        @keyframes loading {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 0%; }
        }

        .progress-text {
            font-size: 14px;
            opacity: 0.8;
        }

        .contact-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }

        .contact-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .contact-email {
            color: #ffd700;
            text-decoration: none;
            font-weight: 500;
        }

        .contact-email:hover {
            text-decoration: underline;
        }

        .admin-link {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px 15px;
            border-radius: 25px;
            color: white;
            text-decoration: none;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
        }

        .admin-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .retry-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .retry-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body>
    <div class="maintenance-container">
        <div class="maintenance-icon">
            <i class="material-icons">construction</i>
        </div>

        <h1 class="maintenance-title" id="maintenanceTitle">
            🚧 Website Under Maintenance
        </h1>

        <p class="maintenance-message" id="maintenanceMessage">
            We're currently performing scheduled maintenance to improve your experience. 
            We'll be back shortly! Thank you for your patience.
        </p>

        <div id="estimatedTimeContainer" class="estimated-time" style="display: none;">
            <i class="material-icons">schedule</i>
            <span>Estimated time: <span id="estimatedTime"></span></span>
        </div>

        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <div class="progress-text">Working on improvements...</div>
        </div>

        <div class="contact-info">
            <div class="contact-title">Need immediate assistance?</div>
            <a href="mailto:support@goatmart.com" class="contact-email">
                support@goatmart.com
            </a>
        </div>

        <button class="retry-button" onclick="checkMaintenanceStatus()">
            <i class="material-icons" style="font-size: 18px;">refresh</i>
            Check Again
        </button>
    </div>

    <a href="/admin-login" class="admin-link">
        <i class="material-icons" style="font-size: 16px; vertical-align: middle;">admin_panel_settings</i>
        Admin
    </a>

    <script>
        // Load maintenance information from server
        async function loadMaintenanceInfo() {
            try {
                const response = await fetch('/api/maintenance');
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('maintenanceTitle').textContent = data.title || '🚧 Website Under Maintenance';
                    document.getElementById('maintenanceMessage').textContent = data.message || 'We\'re currently performing scheduled maintenance to improve your experience. We\'ll be back shortly! Thank you for your patience.';

                    if (data.estimatedTime) {
                        document.getElementById('estimatedTime').textContent = data.estimatedTime;
                        document.getElementById('estimatedTimeContainer').style.display = 'flex';
                    }
                }
            } catch (error) {
                console.error('Error loading maintenance info:', error);
            }
        }

        // Check if maintenance mode is still active
        async function checkMaintenanceStatus() {
            try {
                const response = await fetch('/api/maintenance');
                if (response.ok) {
                    const data = await response.json();
                    if (!data.enabled) {
                        window.location.reload();
                    } else {
                        // Show a message that maintenance is still active
                        const button = document.querySelector('.retry-button');
                        const originalText = button.innerHTML;
                        button.innerHTML = '<i class="material-icons" style="font-size: 18px;">info</i>Still in maintenance...';
                        setTimeout(() => {
                            button.innerHTML = originalText;
                        }, 2000);
                    }
                }
            } catch (error) {
                console.error('Error checking maintenance status:', error);
            }
        }

        // Initialize
        loadMaintenanceInfo();

        // Check every 30 seconds if maintenance is still active
        setInterval(checkMaintenanceStatus, 30000);
    </script>
</body>
</html>
