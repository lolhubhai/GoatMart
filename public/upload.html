<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Upload Command - GoatMart</title>

    <!-- Theme Color for Android -->
    <meta name="theme-color" content="#6366f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Material+Icons+Outlined&family=Material+Icons&display=swap" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <!-- CodeMirror CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/monokai.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/material-darker.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/xq-light.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/xq-dark.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/theme/github.min.css">

    <link rel="stylesheet" href="css/mobile.css">
    <link rel="stylesheet" href="css/animations.css">

    <style>
        /* Android Material Design Variables */
        :root {
            --primary: #6366f1;
            --primary-variant: #4f46e5;
            --secondary: #10b981;
            --secondary-variant: #059669;
            --surface: #ffffff;
            --background: #f8fafc;
            --error: #ef4444;
            --on-primary: #ffffff;
            --on-secondary: #ffffff;
            --on-surface: #1f2937;
            --on-background: #374151;
            --elevation-1: 0 1px 3px rgba(0,0,0,0.12), 0 1px 2px rgba(0,0,0,0.24);
            --elevation-2: 0 3px 6px rgba(0,0,0,0.16), 0 3px 6px rgba(0,0,0,0.23);
            --elevation-3: 0 10px 20px rgba(0,0,0,0.19), 0 6px 6px rgba(0,0,0,0.23);
            --radius-small: 4px;
            --radius-medium: 8px;
            --radius-large: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: rgba(0,0,0,0);
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: var(--on-background);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Material Design Top App Bar */
        .top-app-bar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            box-shadow: var(--elevation-2);
            border-bottom: 1px solid rgba(0,0,0,0.12);
        }

        .app-bar-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .app-bar-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--on-surface);
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(0,0,0,0.04);
        }

        .app-title {
            font-size: 20px;
            font-weight: 500;
            color: var(--on-surface);
        }

        /* Main Content */
        .main-content {
            margin-top: 64px;
            min-height: calc(100vh - 64px);
            padding: 24px 16px;
        }

        .upload-container {
            max-width: 600px;
            margin: 0 auto;
        }

        .upload-card {
            background: var(--surface);
            border-radius: var(--radius-large);
            padding: 32px;
            box-shadow: var(--elevation-3);
            margin-bottom: 24px;
        }

        .upload-title {
            font-size: 24px;
            font-weight: 400;
            margin-bottom: 8px;
            color: var(--on-surface);
            text-align: center;
        }

        .upload-subtitle {
            color: var(--on-surface);
            opacity: 0.7;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--on-surface);
        }

        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 16px;
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: var(--radius-small);
            font-size: 16px;
            font-family: 'Roboto', sans-serif;
            background: var(--surface);
            color: var(--on-surface);
            transition: border-color 0.2s;
        }

        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            border-width: 2px;
            padding: 15px;
        }

        .form-textarea {
            min-height: 120px;
            resize: vertical;
        }

        /* Code Editor Styling */
        .editor-toolbar {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            padding: 8px;
            background: var(--surface);
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: var(--radius-small) var(--radius-small) 0 0;
        }

        .editor-toolbar .btn-text {
            background: none;
            border: none;
            color: var(--primary);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px;
        }

        .editor-toolbar .btn-text:hover {
            background: rgba(99, 102, 241, 0.04);
            border-radius: var(--radius-small);
        }

        .code-editor {
            border: 1px solid rgba(0,0,0,0.12);
            border-radius: 0 0 var(--radius-small) var(--radius-small);
            border-top: none;
        }

        .CodeMirror {
            height: 300px; /* Adjust height as needed */
            border-radius: var(--radius-small);
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }

        .cm-s-default {
            border-radius: var(--radius-small);
        }
        /* End Code Editor Styling */

        /* Material Design Buttons */
        .btn {
            border: none;
            border-radius: var(--radius-small);
            font-family: 'Roboto', sans-serif;
            font-weight: 500;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .btn-contained {
            background: var(--primary);
            color: var(--on-primary);
            padding: 16px 32px;
            box-shadow: var(--elevation-1);
            width: 100%;
            font-size: 16px;
        }

        .btn-contained:hover {
            box-shadow: var(--elevation-2);
            transform: translateY(-1px);
        }

        .btn-outlined {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 15px 31px;
            width: 100%;
        }

        .btn-outlined:hover {
            background: rgba(99, 102, 241, 0.04);
        }

        /* Success/Error Messages */
        .message {
            padding: 16px;
            border-radius: var(--radius-small);
            margin-bottom: 24px;
            display: none;
        }

        .message.success {
            background: rgba(16, 185, 129, 0.1);
            color: var(--secondary);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .message.error {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        /* Enhanced Features Styling */
        .suggestion-tag {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .suggestion-tag:hover {
            background: rgba(99, 102, 241, 0.2);
            transform: translateY(-1px);
        }

        .difficulty-beginner {
            background: rgba(16, 185, 129, 0.1) !important;
            color: var(--secondary) !important;
        }

        .difficulty-intermediate {
            background: rgba(245, 158, 11, 0.1) !important;
            color: #d97706 !important;
        }

        .difficulty-advanced {
            background: rgba(239, 68, 68, 0.1) !important;
            color: var(--error) !important;
        }

        .editor-container {
            position: relative;
            border-radius: var(--radius-small);
            overflow: hidden;
        }

        .editor-toolbar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
            padding: 12px;
            background: var(--surface-variant);
            border: 1px solid var(--outline);
            border-radius: var(--radius-small) var(--radius-small) 0 0;
        }

        .editor-toolbar select {
            padding: 6px 12px;
            border: 1px solid var(--outline);
            border-radius: var(--radius-small);
            background: var(--surface);
            color: var(--on-surface);
            font-size: 14px;
        }

        .command-meta {
            display: flex;
            justify-content: space-between;
            align-items: start;
            width: 100%;
        }

        .star-rating {
            display: flex;
            align-items: center;
            gap: 2px;
        }

        /* Enhanced animations */
        .command-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .command-card:hover {
            transform: translateY(-4px) scale(1.02);
        }

        /* Progress indicator for form completion */
        .form-progress {
            width: 100%;
            height: 4px;
            background: var(--outline-variant);
            border-radius: 2px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .form-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .upload-card {
                padding: 24px 16px;
                margin: 0 8px 16px;
            }

            .main-content {
                padding: 16px 8px;
            }

            .editor-toolbar {
                flex-direction: column;
                gap: 8px;
            }

            .editor-toolbar select,
            .editor-toolbar .btn {
                width: 100%;
            }

            .command-actions {
                flex-direction: column;
                gap: 8px;
            }

            .command-stats {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Material Design Top App Bar -->
    <header class="top-app-bar">
        <div class="app-bar-content">
            <div class="app-bar-title">
                <button class="back-btn" onclick="window.history.back()">
                    <i class="material-icons">arrow_back</i>
                </button>
                <div class="app-title">Upload Command</div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="upload-container">
            <div class="upload-card">
                <h1 class="upload-title">Share Your Command</h1>
                <p class="upload-subtitle">Upload your bot command to help the community</p>

                <div id="message" class="message"></div>

                <form id="uploadForm">
                    <div class="form-group">
                        <label class="form-label" for="itemName">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">title</i>
                            Command Name
                        </label>
                        <input type="text" id="itemName" name="itemName" class="form-input" required
                               placeholder="Enter your command name">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="type">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">category</i>
                            Bot Type
                        </label>
                        <select id="type" name="type" class="form-select" required>
                            <option value="">Select bot type</option>
                            <option value="GoatBot">GoatBot</option>
                            <option value="MiraiBot">MiraiBot</option>
                            <option value="AutoBot">AutoBot</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="authorName">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">person</i>
                            Author Name
                        </label>
                        <input type="text" id="authorName" name="authorName" class="form-input" required
                               placeholder="Your name">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">description</i>
                            Description
                        </label>
                        <textarea id="description" name="description" class="form-textarea" required
                                  placeholder="Describe what your command does"></textarea>
                    </div>

                    <!-- Advanced code editor with live preview -->
                    <div class="form-group">
                        <label class="form-label" for="code">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">code</i>
                            Command Code
                        </label>
                        <div class="editor-toolbar">
                            <select id="editorTheme" onchange="changeEditorTheme()">
                                <option value="default">Default Light</option>
                                <option value="material-darker">Material Dark</option>
                                <option value="monokai">Monokai</option>
                                <option value="github">GitHub</option>
                                <option value="xq-dark">XQ Dark</option>
                            </select>
                            <select id="editorLanguage" onchange="changeEditorLanguage()">
                                <option value="javascript">JavaScript</option>
                                <option value="python">Python</option>
                                <option value="json">JSON</option>
                                <option value="markdown">Markdown</option>
                            </select>
                            <button type="button" onclick="insertTemplate()" class="btn btn-text">
                                <i class="material-icons">integration_instructions</i>
                                Template
                            </button>
                            <button type="button" onclick="formatCode()" class="btn btn-text">
                                <i class="material-icons">code</i>
                                Format
                            </button>
                            <button type="button" onclick="validateCode()" class="btn btn-text">
                                <i class="material-icons">check_circle</i>
                                Validate
                            </button>
                            <button type="button" onclick="togglePreview()" class="btn btn-text">
                                <i class="material-icons">preview</i>
                                Preview
                            </button>
                            <button type="button" onclick="toggleFullscreen()" class="btn btn-text">
                                <i class="material-icons">fullscreen</i>
                                Fullscreen
                            </button>
                        </div>
                        <div class="editor-container" style="position: relative;">
                            <div id="codeEditor" class="code-editor"></div>
                            <div id="editorStats" style="position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; display: none;">
                                Lines: <span id="lineCount">0</span> | Chars: <span id="charCount">0</span>
                            </div>
                        </div>
                        <textarea id="code" name="code" style="display: none;" required></textarea>
                    </div>

                    <!-- Live Preview Panel -->
                    <div class="form-group" id="previewPanel" style="display: none;">
                        <label class="form-label">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">preview</i>
                            Live Preview
                        </label>
                        <div id="commandPreview" style="background: var(--surface-variant); border: 1px solid var(--outline); border-radius: var(--radius-small); padding: 16px; min-height: 100px;">
                            <div class="preview-placeholder" style="text-align: center; color: var(--on-surface); opacity: 0.6;">
                                <i class="material-icons" style="font-size: 48px; margin-bottom: 8px;">preview</i>
                                <p>Fill in the form to see a preview of your command</p>
                            </div>
                        </div>
                    </div>

                    <!-- Tags and Categories -->
                    <div class="form-group">
                        <label class="form-label" for="tags">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">sell</i>
                            Tags (comma-separated)
                        </label>
                        <input type="text" id="tags" name="tags" class="form-input"
                               placeholder="e.g., utility, moderation, fun, music">
                        <div class="tag-suggestions" style="margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px;">
                            <span class="suggestion-tag" onclick="addTag('utility')">utility</span>
                            <span class="suggestion-tag" onclick="addTag('moderation')">moderation</span>
                            <span class="suggestion-tag" onclick="addTag('fun')">fun</span>
                            <span class="suggestion-tag" onclick="addTag('music')">music</span>
                            <span class="suggestion-tag" onclick="addTag('admin')">admin</span>
                            <span class="suggestion-tag" onclick="addTag('game')">game</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="difficulty">
                            <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">bar_chart</i>
                            Difficulty Level
                        </label>
                        <select id="difficulty" name="difficulty" class="form-select">
                            <option value="Beginner">Beginner - Easy to understand and use</option>
                            <option value="Intermediate" selected>Intermediate - Some experience required</option>
                            <option value="Advanced">Advanced - Expert knowledge needed</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-contained">
                        <i class="material-icons">cloud_upload</i>
                        Upload Command
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- JavaScript -->
    <script src="js/android-ui.js"></script>
    <!-- CodeMirror JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/json/json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/formatDoc.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/edit/matchbrackets.min.js"></script>

    <script>
        // Initialize CodeMirror editor
        var codeEditor = CodeMirror(document.getElementById("codeEditor"), {
            lineNumbers: true,
            matchBrackets: true,
            mode: "javascript", // Default mode
            theme: "default",   // Default theme
            lineWrapping: true,
            autofocus: true,
            value: "" // Initial value, will be populated from textarea
        });

        // Sync textarea with CodeMirror editor
        codeEditor.on("change", function(instance) {
            document.getElementById("code").value = instance.getValue();
        });

        // Load initial value from textarea if any
        document.getElementById("code").addEventListener('input', function() {
            codeEditor.setValue(this.value);
        });

        function changeEditorTheme() {
            const theme = document.getElementById("editorTheme").value;
            codeEditor.setOption("theme", theme);
        }

        function changeEditorLanguage() {
            const lang = document.getElementById("editorLanguage").value;
            codeEditor.setOption("mode", lang);
        }

        function formatCode() {
            codeEditor.autoFormatRange({line: 0, ch: 0}, {line: codeEditor.lastLine()});
        }

        function validateCode() {
            const currentMode = codeEditor.getOption("mode");
            const code = codeEditor.getValue();
            let isValid = true;
            let errorMessage = '';
            let suggestions = [];

            if (currentMode === "javascript") {
                try {
                    new Function(code);
                    // Check for common patterns
                    if (code.includes('console.log')) {
                        suggestions.push('Consider using proper logging in production');
                    }
                    if (code.includes('eval(')) {
                        suggestions.push('Avoid using eval() for security reasons');
                    }
                } catch (e) {
                    isValid = false;
                    errorMessage = e.message;
                }
            } else if (currentMode === "python") {
                if (code.trim() === "") {
                    isValid = false;
                    errorMessage = "Python code cannot be empty.";
                } else {
                    // Basic Python checks
                    const lines = code.split('\n');
                    let indentationError = false;
                    lines.forEach((line, index) => {
                        if (line.trim() && line.startsWith(' ') && !line.startsWith('    ')) {
                            indentationError = true;
                        }
                    });
                    if (indentationError) {
                        suggestions.push('Use 4 spaces for indentation in Python');
                    }
                }
            }

            const messageDiv = document.getElementById('message');
            messageDiv.style.display = 'block';
            if (isValid) {
                messageDiv.className = 'message success';
                let content = '<i class="material-icons" style="vertical-align: middle; margin-right: 8px;">check_circle</i> Code is valid!';
                if (suggestions.length > 0) {
                    content += '<ul style="margin: 8px 0 0 24px;">' + suggestions.map(s => `<li>${s}</li>`).join('') + '</ul>';
                }
                messageDiv.innerHTML = content;
            } else {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = `<i class="material-icons" style="vertical-align: middle; margin-right: 8px;">error</i> Code validation failed: ${errorMessage}`;
            }
        }

        function insertTemplate() {
            const type = document.getElementById('type').value;
            const language = document.getElementById('editorLanguage').value;
            
            let template = '';
            
            if (language === 'javascript') {
                if (type === 'GoatBot') {
                    template = `module.exports = {
    config: {
        name: "commandname",
        aliases: [],
        version: "1.0.0",
        author: "Your Name",
        countDown: 5,
        role: 0,
        shortDescription: "Short description",
        longDescription: "Detailed description of the command",
        category: "utility",
        guide: {
            en: "{prefix}commandname [args]"
        }
    },
    
    onStart: async function ({ message, args, api, event }) {
        // Your command logic here
        return message.reply("Hello from GoatBot!");
    }
};`;
                } else if (type === 'MiraiBot') {
                    template = `module.exports.config = {
    name: "commandname",
    version: "1.0.0",
    hasPermssion: 0,
    credits: "Your Name",
    description: "Command description",
    commandCategory: "Utility",
    usages: "[args]",
    cooldowns: 5
};

module.exports.run = async function({ api, event, args }) {
    // Your command logic here
    return api.sendMessage("Hello from MiraiBot!", event.threadID);
};`;
                }
            } else if (language === 'python') {
                template = `#!/usr/bin/env python3
# -*- coding: utf-8 -*-

"""
Command Name: Your Command

        function togglePreview() {
            const previewPanel = document.getElementById('previewPanel');
            const isVisible = previewPanel.style.display !== 'none';
            
            if (isVisible) {
                previewPanel.style.display = 'none';
            } else {
                previewPanel.style.display = 'block';
                updatePreview();
            }
        }

        function toggleFullscreen() {
            const editorContainer = document.querySelector('.editor-container');
            const isFullscreen = editorContainer.classList.contains('fullscreen');
            
            if (isFullscreen) {
                editorContainer.classList.remove('fullscreen');
                document.body.style.overflow = '';
                codeEditor.setSize(null, '300px');
            } else {
                editorContainer.classList.add('fullscreen');
                document.body.style.overflow = 'hidden';
                codeEditor.setSize(null, 'calc(100vh - 120px)');
            }
            
            // Add fullscreen styles
            if (!document.getElementById('fullscreen-styles')) {
                const style = document.createElement('style');
                style.id = 'fullscreen-styles';
                style.textContent = `
                    .editor-container.fullscreen {
                        position: fixed;
                        top: 0;
                        left: 0;
                        right: 0;
                        bottom: 0;
                        z-index: 9999;
                        background: white;
                        padding: 20px;
                    }
                    .editor-container.fullscreen .code-editor {
                        height: calc(100vh - 120px) !important;
                    }
                `;
                document.head.appendChild(style);
            }
        }

        function updatePreview() {
            const name = document.getElementById('itemName').value || 'Command Name';
            const author = document.getElementById('authorName').value || 'Anonymous';
            const description = document.getElementById('description').value || 'No description provided';
            const type = document.getElementById('type').value || 'GoatBot';
            const difficulty = document.getElementById('difficulty').value || 'Intermediate';
            const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(t => t);
            
            const preview = document.getElementById('commandPreview');
            preview.innerHTML = `
                <div style="border: 1px solid var(--outline); border-radius: var(--radius-small); padding: 16px; background: var(--surface);">
                    <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 12px;">
                        <h3 style="margin: 0; font-size: 18px; color: var(--on-surface);">${name}</h3>
                        <span style="background: var(--primary); color: var(--on-primary); padding: 4px 8px; border-radius: 12px; font-size: 12px;">${type}</span>
                    </div>
                    <div style="margin-bottom: 8px; color: var(--on-surface); opacity: 0.7; font-size: 14px;">
                        <i class="material-icons" style="font-size: 14px; vertical-align: middle; margin-right: 4px;">person</i>
                        ${author}
                    </div>
                    <p style="margin: 12px 0; color: var(--on-surface); line-height: 1.5;">${description}</p>
                    <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px;">
                        <span style="background: rgba(245, 158, 11, 0.1); color: #d97706; padding: 4px 8px; border-radius: 12px; font-size: 12px;">${difficulty}</span>
                        ${tags.map(tag => `<span style="background: rgba(99, 102, 241, 0.1); color: var(--primary); padding: 4px 8px; border-radius: 12px; font-size: 12px;">${tag}</span>`).join('')}
                    </div>
                    <div style="display: flex; gap: 16px; font-size: 12px; color: var(--on-surface); opacity: 0.6;">
                        <span><i class="material-icons" style="font-size: 12px; vertical-align: middle; margin-right: 2px;">visibility</i> 0 views</span>
                        <span><i class="material-icons" style="font-size: 12px; vertical-align: middle; margin-right: 2px;">favorite</i> 0 likes</span>
                        <span><i class="material-icons" style="font-size: 12px; vertical-align: middle; margin-right: 2px;">download</i> 0 downloads</span>
                    </div>
                </div>
            `;
        }

        function addTag(tag) {
            const tagsInput = document.getElementById('tags');
            const currentTags = tagsInput.value.split(',').map(t => t.trim()).filter(t => t);
            
            if (!currentTags.includes(tag)) {
                currentTags.push(tag);
                tagsInput.value = currentTags.join(', ');
                updatePreview();
            }
        }

        function updateEditorStats() {
            const code = codeEditor.getValue();
            const lines = code.split('\n').length;
            const chars = code.length;
            
            document.getElementById('lineCount').textContent = lines;
            document.getElementById('charCount').textContent = chars;
            document.getElementById('editorStats').style.display = 'block';
        }

        function showSnackbar(message) {
            // Create snackbar
            const snackbar = document.createElement('div');
            snackbar.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: #323232;
                color: white;
                padding: 16px 24px;
                border-radius: 8px;
                font-weight: 500;
                z-index: 10000;
                animation: snackbarSlideIn 0.3s ease;
            `;
            snackbar.textContent = message;
            
            // Add animation
            if (!document.getElementById('snackbar-animation')) {
                const style = document.createElement('style');
                style.id = 'snackbar-animation';
                style.textContent = `
                    @keyframes snackbarSlideIn {
                        from { transform: translateX(-50%) translateY(100px); opacity: 0; }
                        to { transform: translateX(-50%) translateY(0); opacity: 1; }
                    }
                `;
                document.head.appendChild(style);
            }
            
            document.body.appendChild(snackbar);
            
            setTimeout(() => {
                snackbar.remove();
            }, 3000);
        }

        // Auto-update preview and stats
        ['itemName', 'authorName', 'description', 'type', 'difficulty', 'tags'].forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                element.addEventListener('input', updatePreview);
            }
        });

        // Update editor stats on change
        codeEditor.on('change', updateEditorStats);


        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const messageDiv = document.getElementById('message');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Show loading state
            submitBtn.innerHTML = '<i class="material-icons">hourglass_empty</i> Uploading...';
            submitBtn.disabled = true;

            const formData = {
                itemName: document.getElementById('itemName').value,
                type: document.getElementById('type').value,
                authorName: document.getElementById('authorName').value,
                description: document.getElementById('description').value,
                code: document.getElementById('code').value // Get code from the hidden textarea
            };

            try {
                const response = await fetch('/v1/paste', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.style.display = 'block';
                    messageDiv.innerHTML = `
                        <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">check_circle</i>
                        Command uploaded successfully! <a href="view.html?id=${result.itemID}" style="color: var(--secondary); text-decoration: underline;">View your command</a>
                    `;

                    // Reset form
                    e.target.reset();
                    codeEditor.setValue(''); // Clear the editor

                    // Show snackbar
                    if (window.AndroidUI) {
                        AndroidUI.showSnackbar('Command uploaded successfully! 🎉');
                    }

                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = `view.html?id=${result.itemID}`;
                    }, 2000);
                } else {
                    throw new Error(result.error || 'Upload failed');
                }
            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.style.display = 'block';
                messageDiv.innerHTML = `
                    <i class="material-icons" style="vertical-align: middle; margin-right: 8px;">error</i>
                    Error: ${error.message}
                `;

                if (window.AndroidUI) {
                    AndroidUI.showSnackbar('Upload failed. Please try again.', null, 3000);
                }
            } finally {
                // Reset button
                submitBtn.innerHTML = '<i class="material-icons">cloud_upload</i> Upload Command';
                submitBtn.disabled = false;
            }
        });
    </script>
