
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GoatMart • Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="nav-menu">
    <div class="nav-left">
      <a href="/dashboard" class="nav-link active"><i class="fas fa-home"></i> Dashboard</a>
      <a href="/paste" class="nav-link"><i class="fas fa-plus-circle"></i> Create Paste</a>
      <a href="/profile" class="nav-link"><i class="fas fa-user"></i> Profile</a>
    </div>
    <div class="nav-right">
      <button id="darkModeToggle" class="nav-link">
        <i class="fas fa-moon"></i>
      </button>
      <button onclick="logout()" class="nav-link">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </nav>

  <header class="site-header">
    <img src="https://cdn-icons-png.flaticon.com/512/724/724933.png" alt="GoatMart Logo" class="logo animated">
    <h1><i class="fas fa-robot"></i> GoatMart</h1>
    <p class="tagline"><i class="fas fa-code"></i> Share and Discover Bot Commands</p>
    <div id="statsCounter" class="stats-container"></div>
  </header>

  <div class="search-bar">
    <div class="filters">
      <select id="typeFilter" onchange="filterItems()">
        <option value="">All Types</option>
        <option value="GoatBot">🤖 GoatBot</option>
        <option value="MiraiBot">🔮 MiraiBot</option>
        <option value="AutoBot">⚡ AutoBot</option>
        <option value="NeuralBot">🧠 NeuralBot</option>
        <option value="CustomBot">🎯 CustomBot</option>
      </select>
      <select id="difficultyFilter" onchange="filterItems()">
        <option value="">All Difficulties</option>
        <option value="Beginner">👶 Beginner</option>
        <option value="Intermediate">👨‍💻 Intermediate</option>
        <option value="Advanced">🎓 Advanced</option>
      </select>
      <select id="sortBy" onchange="filterItems()">
        <option value="newest">🔄 Newest First</option>
        <option value="featured">⭐ Featured</option>
        <option value="verified">✓ Verified Only</option>
        <option value="popular">🔥 Most Popular</option>
        <option value="rated">⭐ Highest Rated</option>
      </select>
      <div class="search-input">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Search commands..." onkeyup="filterItems()">
      </div>
    </div>
  </div>

  <section class="command-list">
    <h2><i class="fas fa-list-ul"></i> Recent Commands</h2>
    <div id="itemList" class="paste-grid"></div>
  </section>

  <footer class="site-footer">
    <div class="social-links">
      <a href="#"><i class="fab fa-github"></i></a>
      <a href="#"><i class="fab fa-discord"></i></a>
      <a href="#"><i class="fab fa-twitter"></i></a>
    </div>
    <p>&copy; 2025 GoatMart • All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
