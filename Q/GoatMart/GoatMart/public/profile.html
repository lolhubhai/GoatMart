<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile • GoatMart</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <nav class="nav-menu">
    <div class="nav-left">
      <a href="/dashboard" class="nav-link"><i class="fas fa-home"></i> Home</a>
      <a href="/profile" class="nav-link active"><i class="fas fa-user"></i> Profile</a>
    </div>
    <div class="nav-right">
      <button onclick="logout()" class="nav-link"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>
  </nav>

  <div class="profile-container">
    <div class="profile-header-card">
      <div class="profile-cover">
        <div class="profile-avatar">
          <img id="userAvatar" src="/uploads/default.png" alt="Profile">
        </div>
      </div>
      <div class="profile-info">
        <div class="profile-header-info">
          <h1 id="userName">Loading...</h1>
          <p id="userUsername">@loading...</p>
          <p id="joinDate">Joined: Loading...</p>
        </div>
        <button onclick="toggleEditProfile()" class="edit-btn"><i class="fas fa-edit"></i> Edit Profile</button>
      </div>

      <form class="edit-profile-form" style="display: none;" onsubmit="event.preventDefault(); const formData = new FormData(this); updateProfile(formData);">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Name</label>
          <input type="text" name="name" id="editName" required>
        </div>
        <div class="form-group">
          <label><i class="fas fa-image"></i> Profile Picture</label>
          <div class="file-upload">
            <input type="file" name="profilePicture" id="profilePicture" accept="image/*" onchange="previewImage(this)">
            <label for="profilePicture"><i class="fas fa-cloud-upload-alt"></i> Choose file</label>
          </div>
          <img id="profilePreview" src="/uploads/default.png" alt="Preview" class="profile-preview">
        </div>
        <div class="button-group">
          <button type="submit" class="save-btn"><i class="fas fa-save"></i> Save Changes</button>
          <button type="button" onclick="toggleEditProfile()" class="cancel-btn"><i class="fas fa-times"></i> Cancel</button>
        </div>
      </form>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
